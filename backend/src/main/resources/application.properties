# ========================
# DATABASE CONFIG
# ========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pet_adoption_and_tracking_management_system_check?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================
# SERVER
# ========================
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ========================
# SENDGRID CONFIG
# ========================
sendgrid.api.key=${SENDGRID_API_KEY:}
mail.from=${MAIL_USERNAME:admin@pawpals.com}

# ========================
# FILE UPLOAD
# ========================
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ========================
# JWT
# ========================
app.jwt.secret=${JWT_SECRET:cGF3cGFsc19wZXRfYWRvcHRpb25fc3lzdGVtX3NlY3JldF9rZXlfMjAyNg==}

# ========================
# CORS
# ========================
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# ========================
# ADMIN
# ========================
app.admin.email=${ADMIN_EMAIL:admin@pawpals.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.admin.name=${ADMIN_NAME:Admin}

# ========================
# CLOUDINARY
# ========================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}